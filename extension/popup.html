<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f1117;
      color: #f1f5f9;
      margin: 0;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      border-bottom: 1px solid #28324a;
      padding-bottom: 8px;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .status-connected { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .status-disconnected { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
    .btn {
      width: 100%;
      padding: 8px;
      background-color: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background-color: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <span>⚡ Veloxis Accelerator</span>
  </div>
  <div>Daemon Status:</div>
  <div id="conn-status" class="status-badge status-disconnected">Checking...</div>
  <button class="btn" id="btn-open-dashboard">Open Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
